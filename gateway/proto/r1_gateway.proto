syntax = "proto3";

package r1.motion.gateway.v1;

service R1Gateway {
  rpc GetCapabilities(Empty) returns (Capabilities);
  rpc GetStatus(Empty) returns (RobotStatus);
  rpc InstallMotionPackage(InstallMotionPackageRequest) returns (InstallMotionPackageResponse);
  rpc ValidatePlan(MotionPlan) returns (ValidationResult);
  rpc ExecutePlan(ExecutePlanRequest) returns (ExecutionHandle);
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
  rpc StreamExecutionEvents(ExecutionHandle) returns (stream ExecutionEvent);
}

message Empty {}

message Capabilities {
  string gateway_version = 1;
  repeated string plan_step_types = 2;
  repeated string installed_actions = 3;
  double max_vx_mps = 4;
  double max_vy_mps = 5;
  double max_move_duration_s = 6;
  double max_turn_angle_deg = 7;
  double max_turn_rate_rad_s = 8;
}

message RobotStatus {
  bool connected = 1;
  int32 fsm_id = 2;
  int32 fsm_mode = 3;
  bool lowstate_fresh = 4;
  bool executing = 5;
  string execution_id = 6;
  string fault = 7;
}

message InstallMotionPackageRequest {
  string package_id = 1;
  bytes package_bytes = 2;
  string package_sha256 = 3;
}

message InstallMotionPackageResponse { bool installed = 1; string error = 2; }

message SayStep { string text = 1; }
message ActionStep { string action = 1; map<string, string> parameters = 2; }
message MoveForStep { double vx_mps = 1; double vy_mps = 2; double duration_s = 3; }
message TurnRelativeStep { double angle_deg = 1; }
message WaitStep { double duration_s = 1; }

message PlanStep {
  oneof step {
    SayStep say = 1;
    ActionStep action = 2;
    MoveForStep move_for = 3;
    TurnRelativeStep turn_relative = 4;
    WaitStep wait = 5;
  }
}

message MotionPlan {
  string schema_version = 1;
  string plan_id = 2;
  repeated PlanStep steps = 3;
  bool require_operator_enable = 4;
}

message ValidationResult { bool valid = 1; repeated string errors = 2; }
message ExecutePlanRequest { MotionPlan plan = 1; string idempotency_key = 2; bool operator_enabled = 3; }
message ExecutionHandle { string execution_id = 1; }
message CancelExecutionRequest { string execution_id = 1; }
message CancelExecutionResponse { bool cancelled = 1; }

message ExecutionEvent {
  string execution_id = 1;
  string type = 2;
  int32 step_index = 3;
  string detail = 4;
  int64 monotonic_time_ms = 5;
}
