[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r1-agent-motion"
version = "0.3.0"
description = "Minimal Unitree R1 agent skill demo: named actions over Ethernet DDS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
imitate = ["mujoco>=3.2", "numpy", "opencv-python", "mediapipe>=0.10"]

[project.scripts]
r1-agent = "r1_agent.cli:main"

[tool.setuptools.packages.find]
include = ["r1_agent*", "imitate"]
exclude = ["imitate.library*", "imitate.mirror_library*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
